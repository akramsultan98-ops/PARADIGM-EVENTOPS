# Local / single-VPS deployment. Copy .env.example → .env and set AUTH_SECRET, POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventops
      POSTGRES_USER: eventops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eventops"], interval: 10s, timeout: 5s, retries: 10 }
    ports: ["127.0.0.1:5432:5432"]

  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eventops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/eventops?schema=public
      STORAGE_LOCAL_DIR: /app/storage/uploads
      OPTIMIZER_URL: ${OPTIMIZER_URL:-}
    volumes: [uploads:/app/storage/uploads]
    ports: ["3000:3000"]

  optimizer:
    build: ./services/optimizer
    restart: unless-stopped
    profiles: ["optimizer"]   # docker compose --profile optimizer up
    ports: ["127.0.0.1:8090:8090"]

volumes:
  pgdata:
  uploads:
